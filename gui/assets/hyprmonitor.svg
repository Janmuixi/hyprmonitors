<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Hyprmonitor">
  <!-- App tile: mirrors the GUI canvas (gray 28) -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#1C1C1C"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="#33333A" stroke-width="1"/>

  <!-- Left screen: an "unselected" monitor (GUI fill rgb 70,70,80), bottom-aligned -->
  <rect x="22" y="56" width="40" height="32" rx="5"
        fill="#464650" stroke="#EDEDED" stroke-width="3"/>

  <!-- Right screen: the "selected" monitor (GUI accent rgb 60,120,200), taller, adjacent -->
  <rect x="62" y="42" width="46" height="46" rx="5"
        fill="#3C78C8" stroke="#EDEDED" stroke-width="3"/>
</svg>
